<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa LGBTIfriendly de Sant Andreu de la Barca</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
        }
        .custom-popup .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .custom-marker-icon {
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .custom-marker-icon:hover {
            transform: scale(1.2);
            z-index: 1000 !important;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased overflow-hidden">

    <div class="flex flex-col md:flex-row h-screen w-screen relative">
        
        <!-- Imatge flotant superior esquerra (125x125px, sense text, cantons arrodonits, ombra) -->
        <div class="absolute top-4 left-4 z-[1000] bg-white/90 backdrop-blur-md p-2 rounded-2xl shadow-xl border border-slate-200/80 flex items-center justify-center transition-transform hover:scale-105">
            <img src="image.jpg" alt="Logotip" class="w-[125px] h-[125px] object-cover rounded-xl shadow-inner border border-slate-100" onerror="this.onerror=null; this.src='https://placehold.co/125x125/6366f1/ffffff?text=LGBTI+Map';">
        </div>

        <!-- Contenidor del Mapa -->
        <div class="flex-1 h-full w-full relative">
            <div id="map"></div>
            
            <!-- Barra de Filtres per Categoria (Superposada al mapa) -->
            <div id="category-chips-container" class="absolute top-4 left-40 sm:left-44 right-16 z-[999] flex overflow-x-auto space-x-2 p-1.5 no-scrollbar bg-white/85 backdrop-blur-md rounded-xl shadow-md border border-slate-200/60">
                <!-- Generat dinàmicament per JS -->
            </div>
        </div>

        <!-- Panell Lateral Dret -->
        <div class="w-full md:w-96 lg:w-[420px] bg-white h-1/2 md:h-full z-10 shadow-2xl border-l border-slate-200 flex flex-col">
            <!-- Capçalera del Panell -->
            <div class="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                <div>
                    <h2 class="text-base font-bold text-slate-800">Elements a la vista</h2>
                    <p class="text-xs text-slate-500">Mogui o faci zoom al mapa per actualitzar la llista</p>
                </div>
                <span id="item-count" class="bg-indigo-100 text-indigo-700 font-bold text-xs px-2.5 py-1 rounded-full">0</span>
            </div>

            <!-- Llista d'Elements -->
            <div id="elements-list" class="flex-1 overflow-y-auto p-4 space-y-3 divide-y divide-slate-100">
                <div class="text-center py-8 text-slate-400">
                    <i class="fa-solid fa-map-location-dot text-4xl mb-2 text-slate-300"></i>
                    <p class="text-sm">Carregant dades del mapa...</p>
                </div>
            </div>

            <!-- Peu del panell -->
            <div class="p-2.5 bg-slate-50 border-t border-slate-200 text-center text-[11px] text-slate-500">
                Mapa LGBTIfriendly de Sant Andreu de la Barca &bull; OpenStreetMap
            </div>
        </div>

    </div>

    <script>
        // --- COORDENADES PER DEFECTE: Sant Andreu de la Barca ---
        const DEFAULT_CENTER = [41.4468, 1.9708];
        const DEFAULT_ZOOM = 15;

        // --- DICCIOMARI DE CATEGORIES ---
        const categoriesDict = {
            cafeteria: { label: 'Cafeteries', icon: 'fa-mug-saucer', color: '#d97706', tags: { amenity: ['cafe'] } },
            restaurant: { label: 'Restaurants', icon: 'fa-utensils', color: '#dc2626', tags: { amenity: ['restaurant', 'food_court'] } },
            bar: { label: 'Bars', icon: 'fa-beer-mug-empty', color: '#eab308', tags: { amenity: ['bar', 'pub', 'biergarten'] } },
            panaderia: { label: 'Forns / Panaderies', icon: 'fa-bread-slice', color: '#b45309', tags: { shop: ['bakery', 'pastry'] } },
            farmacia: { label: 'Farmàcies', icon: 'fa-prescription-bottle-medical', color: '#16a34a', tags: { amenity: ['pharmacy'] } },
            clinica: { label: 'Clíniques / Salut', icon: 'fa-briefcase-medical', color: '#2563eb', tags: { amenity: ['clinic', 'hospital', 'doctors', 'dentist'] } },
            perruqueria: { label: 'Estètica / Perruqueries', icon: 'fa-scissors', color: '#ec4899', tags: { shop: ['hairdresser', 'beauty', 'cosmetics'] } },
            ropa: { label: 'Botigues de Roba', icon: 'fa-shirt', color: '#8b5cf6', tags: { shop: ['clothes', 'fashion', 'boutique', 'shoes'] } },
            supermercat: { label: 'Supermercats', icon: 'fa-cart-shopping', color: '#0284c7', tags: { shop: ['supermarket', 'convenience', 'grocery'] } },
            edifici_public: { label: 'Edificis Públics', icon: 'fa-landmark', color: '#475569', tags: { amenity: ['townhall', 'public_building', 'community_centre', 'library'], building: ['public'] } },
            ferreteria: { label: 'Ferreteries', icon: 'fa-wrench', color: '#ea580c', tags: { shop: ['hardware', 'doityourself', 'trade'] } },
            floristeria: { label: 'Floristeries', icon: 'fa-seedling', color: '#10b981', tags: { shop: ['florist', 'flowers'] } },
            educacio: { label: 'Educació', icon: 'fa-graduation-cap', color: '#4f46e5', tags: { amenity: ['school', 'kindergarten', 'college', 'university', 'language_school', 'music_school'] } },
            delicatessen: { label: 'Delicatessen', icon: 'fa-cheese', color: '#d97706', tags: { shop: ['deli', 'delicatessen', 'gourmet'] } },
            medicina_alternativa: { label: 'Medicina Alternativa', icon: 'fa-leaf', color: '#059669', tags: { healthcare: ['alternative'], shop: ['herbalist', 'health_food'] } },
            estanco: { label: 'Estancs', icon: 'fa-[#000000]', iconClass: 'fa-solid fa-store', color: '#9333ea', tags: { shop: ['tobacconist'] } },
            bicicletes: { label: 'Bicicletes', icon: 'fa-bicycle', color: '#06b6d4', tags: { shop: ['bicycle'] } },
            tintoreria: { label: 'Tintoreries / Bugaderies', icon: 'fa-jug-detergent', color: '#6366f1', tags: { shop: ['dry_cleaning', 'laundry'] } },
            altres: { label: 'Altres', icon: 'fa-location-dot', color: '#6b7280', tags: {} }
        };

        // --- MAPES CLARS EN GRISOS (CARTODB POSITRON PER DEFECTE SENSE API KEY) ---
        const cartoPositron = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        });

        const osmStandard = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        });

        const cartoDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        });

        const map = L.map('map', {
            center: DEFAULT_CENTER,
            zoom: DEFAULT_ZOOM,
            layers: [cartoPositron]
        });

        const baseMaps = {
            "Gris clar (CartoDB Positron)": cartoPositron,
            "OpenStreetMap Estàndard": osmStandard,
            "Gris fosc (CartoDB Dark)": cartoDark
        };
        L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

        let allMarkers = [];
        let geojsonLayer = null;
        let activeCategory = 'all';

        // --- TRADUCCIÓ D'HORARIS AL CATALÀ ---
        function translateOpeningHours(oh) {
            if (!oh) return null;
            let translated = oh;

            const daysMap = {
                'Mo': 'Dl', 'Tu': 'Dt', 'We': 'Dc', 'Th': 'Dj', 'Fr': 'Dv', 'Sa': 'Ds', 'Su': 'Dg',
                'Mo-Fr': 'Dl-Dv', 'Mo-Sa': 'Dl-Ds', 'Sa-Su': 'Ds-Dg', 'PH': 'Festius', 'Off': 'Tancat'
            };

            for (const [key, val] of Object.entries(daysMap)) {
                const reg = new RegExp('\\b' + key + '\\b', 'g');
                translated = translated.replace(reg, val);
            }

            translated = translated.replace(/24\/7/g, 'Obert 24h');
            translated = translated.replace(/off/gi, 'Tancat');
            return translated;
        }

        // --- DETERMINAR CATEGORIA DE L'ELEMENT ---
        function getCategoryDetails(props) {
            const amenity = (props.amenity || '').toLowerCase();
            const shop = (props.shop || '').toLowerCase();
            const healthcare = (props.healthcare || '').toLowerCase();
            const building = (props.building || '').toLowerCase();

            for (const [key, cat] of Object.entries(categoriesDict)) {
                if (key === 'altres') continue;
                const t = cat.tags;
                if (t.amenity && t.amenity.includes(amenity)) return { key, ...cat };
                if (t.shop && t.shop.includes(shop)) return { key, ...cat };
                if (t.healthcare && t.healthcare.includes(healthcare)) return { key, ...cat };
                if (t.building && t.building.includes(building)) return { key, ...cat };
            }

            return { key: 'altres', ...categoriesDict.altres };
        }

        // --- CREAR ICONA DEL MARCADOR ---
        function createCustomIcon(cat) {
            const iconClass = cat.iconClass || `fa-solid ${cat.icon}`;
            return L.divIcon({
                className: 'custom-marker-icon',
                html: `
                    <div style="background-color: ${cat.color};" class="w-8 h-8 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white">
                        <i class="${iconClass} text-xs"></i>
                    </div>
                `,
                iconSize: [32, 32],
                iconAnchor: [16, 32],
                popupAnchor: [0, -32]
            });
        }

        // --- POPUPS ---
        function generatePopupHTML(props, cat) {
            const name = props.name || 'Sense nom';
            const hours = translateOpeningHours(props.opening_hours);
            const website = props.website || props['contact:website'];
            const phone = props.phone || props['contact:phone'];
            const instagram = props.instagram || props['contact:instagram'];
            const street = props['addr:street'] || props.street || '';
            const housenumber = props['addr:housenumber'] || props.housenumber || '';
            const address = (street || housenumber) ? `${street} ${housenumber}`.trim() : null;

            return `
                <div class="p-2 max-w-xs font-sans">
                    <div class="flex items-center space-x-2 mb-1">
                        <span class="text-xs px-2 py-0.5 rounded-full text-white font-medium" style="background-color: ${cat.color}">
                            ${cat.label}
                        </span>
                    </div>
                    <h3 class="font-bold text-slate-900 text-base leading-snug mb-1">${name}</h3>
                    
                    ${address ? `<p class="text-xs text-slate-600 mb-2"><i class="fa-solid fa-location-dot mr-1 text-slate-400"></i>${address}</p>` : ''}
                    
                    <div class="space-y-1 text-xs border-t border-slate-100 pt-2 mt-1">
                        ${hours ? `
                            <div class="flex items-start text-slate-700">
                                <i class="fa-regular fa-clock mt-0.5 mr-1.5 text-indigo-500"></i>
                                <span><strong>Horari:</strong> ${hours}</span>
                            </div>
                        ` : ''}
                        
                        ${phone ? `
                            <div class="flex items-center text-slate-700">
                                <i class="fa-solid fa-phone mr-1.5 text-emerald-500"></i>
                                <a href="tel:${phone}" class="hover:underline text-indigo-600 font-medium">${phone}</a>
                            </div>
                        ` : ''}
                        
                        ${website ? `
                            <div class="flex items-center text-slate-700 truncate">
                                <i class="fa-solid fa-globe mr-1.5 text-blue-500"></i>
                                <a href="${website}" target="_blank" rel="noopener" class="text-indigo-600 hover:underline truncate font-medium">${website.replace(/^https?:\/\//, '')}</a>
                            </div>
                        ` : ''}
                        
                        ${instagram ? `
                            <div class="flex items-center text-slate-700">
                                <i class="fa-brands fa-instagram mr-1.5 text-pink-500"></i>
                                <a href="${instagram.startsWith('http') ? instagram : 'https://instagram.com/' + instagram.replace('@','')}" target="_blank" rel="noopener" class="text-pink-600 hover:underline font-medium">Instagram</a>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // --- RENDERITZAR CHIPS DE CATEGORIES ---
        function renderCategoryChips() {
            const container = document.getElementById('category-chips-container');
            container.innerHTML = '';

            // Botó "Tots"
            const allBtn = document.createElement('button');
            allBtn.className = `cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition border ${
                activeCategory === 'all' ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100'
            }`;
            allBtn.textContent = 'Tots';
            allBtn.onclick = () => filterCategory('all');
            container.appendChild(allBtn);

            // Botons per categoria
            Object.entries(categoriesDict).forEach(([key, cat]) => {
                if (key === 'altres') return;
                const btn = document.createElement('button');
                const isActive = activeCategory === key;
                btn.className = `cat-btn px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition border flex items-center space-x-1.5 ${
                    isActive ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100'
                }`;
                btn.innerHTML = `<i class="${cat.iconClass || 'fa-solid ' + cat.icon}" style="${isActive ? '' : 'color:' + cat.color}"></i> <span>${cat.label}</span>`;
                btn.onclick = () => filterCategory(key);
                container.appendChild(btn);
            });
        }

        // --- CÀRREGA DE DADES GEOJSON ---
        async function loadGeoJSONData() {
            try {
                const response = await fetch('data.geojson');
                if (!response.ok) throw new Error('Fitxer local data.geojson no trobat.');
                const data = await response.json();
                processGeoJSON(data);
            } catch (err) {
                console.warn("Utilitzant dades de demostració de Sant Andreu de la Barca...", err);
                const sampleData = {
                    "type": "FeatureCollection",
                    "features": [
                        {
                            "type": "Feature",
                            "properties": { "name": "Cafè de la Plaça", "amenity": "cafe", "opening_hours": "Mo-Fr 07:30-20:00; Sa 08:00-14:00", "phone": "+34 936 82 00 11", "addr:street": "Plaça de la Constitució", "addr:housenumber": "1" },
                            "geometry": { "type": "Point", "coordinates": [1.9708, 41.4468] }
                        },
                        {
                            "type": "Feature",
                            "properties": { "name": "Farmàcia Central Sant Andreu", "amenity": "pharmacy", "opening_hours": "Mo-Sa 08:30-21:30", "phone": "+34 936 82 12 34", "addr:street": "Carrer de la Carretera", "addr:housenumber": "24" },
                            "geometry": { "type": "Point", "coordinates": [1.9725, 41.4475] }
                        },
                        {
                            "type": "Feature",
                            "properties": { "name": "Floristeria L'Espigol", "shop": "florist", "opening_hours": "Mo-Sa 09:00-13:30,17:00-20:00", "contact:instagram": "@floristeria_lespigol", "addr:street": "Avinguda de la Constitució", "addr:housenumber": "50" },
                            "geometry": { "type": "Point", "coordinates": [1.9692, 41.4455] }
                        },
                        {
                            "type": "Feature",
                            "properties": { "name": "Bicicletes Sant Andreu", "shop": "bicycle", "opening_hours": "Mo-Fr 09:30-13:30,16:30-20:00", "website": "https://bisisantandreu.cat", "addr:street": "Carrer de Catalunya", "addr:housenumber": "10" },
                            "geometry": { "type": "Point", "coordinates": [1.9731, 41.4482] }
                        },
                        {
                            "type": "Feature",
                            "properties": { "name": "Escola bressol municipal", "amenity": "kindergarten", "opening_hours": "Mo-Fr 08:00-17:00", "addr:street": "Carrer de l'Esport", "addr:housenumber": "5" },
                            "geometry": { "type": "Point", "coordinates": [1.9680, 41.4460] }
                        },
                        {
                            "type": "Feature",
                            "properties": { "name": "Herboristeria i Salut Natural", "shop": "herbalist", "opening_hours": "Mo-Sa 09:00-13:30", "addr:street": "Carrer Major", "addr:housenumber": "15" },
                            "geometry": { "type": "Point", "coordinates": [1.9715, 41.4462] }
                        }
                    ]
                };
                processGeoJSON(sampleData);
            }
        }

        function processGeoJSON(data) {
            allMarkers = [];

            geojsonLayer = L.geoJSON(data, {
                pointToLayer: function (feature, latlng) {
                    const cat = getCategoryDetails(feature.properties);
                    const marker = L.marker(latlng, { icon: createCustomIcon(cat) });
                    
                    marker.bindPopup(generatePopupHTML(feature.properties, cat), { className: 'custom-popup' });
                    
                    allMarkers.push({
                        marker: marker,
                        properties: feature.properties,
                        latlng: latlng,
                        category: cat.key,
                        catInfo: cat
                    });

                    return marker;
                }
            }).addTo(map);

            if (allMarkers.length > 0) {
                const group = L.featureGroup(allMarkers.map(m => m.marker));
                map.fitBounds(group.getBounds().pad(0.1));
            }

            updateSidebarList();
        }

        // --- FILTRAT PER ZOOM I VIEWPORT ---
        function updateSidebarList() {
            const bounds = map.getBounds();
            const listContainer = document.getElementById('elements-list');
            const countContainer = document.getElementById('item-count');

            listContainer.innerHTML = '';

            const visibleItems = allMarkers.filter(item => {
                const isInBounds = bounds.contains(item.latlng);
                const isCatMatch = (activeCategory === 'all' || item.category === activeCategory);
                
                if (isInBounds && isCatMatch) {
                    if (!map.hasLayer(item.marker)) map.addLayer(item.marker);
                } else {
                    if (map.hasLayer(item.marker)) map.removeLayer(item.marker);
                }

                return isInBounds && isCatMatch;
            });

            countContainer.textContent = visibleItems.length;

            if (visibleItems.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i class="fa-solid fa-ghost text-3xl mb-2 text-slate-300"></i>
                        <p class="text-sm font-medium">No hi ha cap element en aquesta àrea.</p>
                        <p class="text-xs text-slate-400 mt-1">Mogui el mapa o seleccioni una altra categoria.</p>
                    </div>
                `;
                return;
            }

            visibleItems.forEach(item => {
                const props = item.properties;
                const cat = item.catInfo;
                const name = props.name || 'Sense nom';
                const hours = translateOpeningHours(props.opening_hours);
                const website = props.website || props['contact:website'];
                const phone = props.phone || props['contact:phone'];
                const instagram = props.instagram || props['contact:instagram'];
                const street = props['addr:street'] || props.street || '';
                const housenumber = props['addr:housenumber'] || props.housenumber || '';
                const address = (street || housenumber) ? `${street} ${housenumber}`.trim() : null;

                const card = document.createElement('div');
                card.className = "pt-3 first:pt-0 hover:bg-slate-50 p-2.5 rounded-xl transition cursor-pointer border border-transparent hover:border-slate-200 group";
                
                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <h3 class="font-bold text-slate-900 group-hover:text-indigo-600 transition text-base leading-snug">${name}</h3>
                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full text-white shrink-0 ml-2" style="background-color: ${cat.color}">
                            ${cat.label}
                        </span>
                    </div>

                    ${address ? `<p class="text-xs text-slate-500 mt-1 flex items-center"><i class="fa-solid fa-location-dot mr-1.5 text-slate-400"></i>${address}</p>` : ''}

                    <div class="mt-2 space-y-1 text-xs text-slate-600">
                        ${hours ? `
                            <div class="flex items-start">
                                <i class="fa-regular fa-clock mt-0.5 mr-1.5 text-indigo-500 shrink-0"></i>
                                <span class="text-slate-700">${hours}</span>
                            </div>
                        ` : ''}
                        
                        <div class="flex flex-wrap gap-x-3 gap-y-1 pt-1.5">
                            ${phone ? `<a href="tel:${phone}" onclick="event.stopPropagation()" class="text-slate-600 hover:text-emerald-600 flex items-center font-medium"><i class="fa-solid fa-phone mr-1 text-emerald-500"></i>${phone}</a>` : ''}
                            ${website ? `<a href="${website}" target="_blank" onclick="event.stopPropagation()" class="text-indigo-600 hover:underline flex items-center font-medium"><i class="fa-solid fa-globe mr-1 text-blue-500"></i>Lloc web</a>` : ''}
                            ${instagram ? `<a href="${instagram.startsWith('http') ? instagram : 'https://instagram.com/' + instagram.replace('@','')}" target="_blank" onclick="event.stopPropagation()" class="text-pink-600 hover:underline flex items-center font-medium"><i class="fa-brands fa-instagram mr-1 text-pink-500"></i>Instagram</a>` : ''}
                        </div>
                    </div>
                `;

                card.onclick = () => {
                    map.panTo(item.latlng);
                    item.marker.openPopup();
                };

                listContainer.appendChild(card);
            });
        }

        // --- FILTRAR PER CATEGORIA ---
        function filterCategory(catKey) {
            activeCategory = catKey;
            renderCategoryChips();
            updateSidebarList();
        }

        map.on('moveend', updateSidebarList);
        map.on('zoomend', updateSidebarList);

        // Inicialitzar
        renderCategoryChips();
        loadGeoJSONData();
    </script>
</body>
</html>
