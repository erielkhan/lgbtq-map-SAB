<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa d'Elements Localitzats</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS (100% lliure i sense API key) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Disseny personalitzat de les marcadores */
        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid white;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;
        }
        .custom-marker:hover, .custom-marker.active {
            transform: scale(1.25);
            z-index: 1000 !important;
            box-shadow: 0 6px 16px rgba(0,0,0,0.45);
        }

        /* Ocultar scrollbars però permetre el desplaçament */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Popups de Leaflet */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .leaflet-popup-content {
            margin: 12px 14px;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 h-screen w-screen overflow-hidden flex flex-col md:flex-row">

    <!-- MAP CONTAINER (Esquerra / Superior) -->
    <div id="map-container" class="relative flex-1 h-1/2 md:h-full w-full order-1">
        <div id="map" class="h-full w-full z-0"></div>
        
        <!-- Indicador Flotant superior esquerre amb imatge -->
        <div class="absolute top-3 left-3 z-[1000] bg-white/95 backdrop-blur-md p-2 pr-4 rounded-xl shadow-lg border border-slate-200/80 flex items-center gap-3">
            <img src="image.jpg" alt="Logo / Logo local" class="w-10 h-10 rounded-lg object-cover border border-slate-200 shadow-sm" onerror="this.src='https://placehold.co/80x80/6366f1/ffffff?text=Mapa'">
            <div>
                <h1 class="text-sm font-bold text-slate-800 leading-tight">Mapa Localitzat</h1>
                <p id="counter-badge" class="text-xs text-slate-500 font-medium">Carregant dades...</p>
            </div>
        </div>
    </div>

    <!-- PANELL LATERAL (Dreta / Inferior) -->
    <div class="w-full md:w-96 lg:w-[440px] h-1/2 md:h-full bg-white flex flex-col border-l border-slate-200 shadow-2xl z-10 order-2">
        
        <!-- Capçalera i Filtres -->
        <div class="p-4 border-b border-slate-100 bg-slate-50/80 backdrop-blur-sm flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-indigo-600"></i> Elements a la vista
                </h2>
                <span id="source-indicator" class="text-[10px] uppercase tracking-wider font-semibold px-2 py-0.5 rounded bg-slate-200 text-slate-600">
                    Comprovant font...
                </span>
            </div>

            <!-- Cerca per text -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="search-input" placeholder="Cerca per nom, adreça o categoria..." 
                       class="w-full pl-9 pr-4 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all shadow-sm">
            </div>

            <!-- Botons / Chips de Categoria -->
            <div id="category-chips" class="flex gap-1.5 overflow-x-auto pb-1 pt-1 no-scrollbar text-xs">
                <!-- S'injecten dinàmicament per JS -->
            </div>
        </div>

        <!-- Llista de Punts d'Interès (POI) en la vista del zoom -->
        <div id="poi-list" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/40">
            <!-- Es carrega dinàmicament en temps real -->
        </div>

        <!-- Peus de pàgina -->
        <div class="p-2.5 bg-white border-t border-slate-100 text-center text-xs text-slate-400">
            Dades d'OpenStreetMap &bull; Sense clave API
        </div>
    </div>

    <!-- LÒGICA EN JAVASCRIPT -->
    <script>
        // Dades GeoJSON per defecte (s'utilitzen si data.geojson no està present al servidor)
        const fallbackGeoJSON = {
            "type": "FeatureCollection",
            "features": [
                {

                    "properties": {

                    },

                },
                {

                    },
                    "geometry": { "type": "Point", "coordinates": [2.1645, 41.3962] }
                },
                {
                    "type": "Feature",
                    "properties": {

                    },

                },
                {
                    "type": "Feature",
                    "properties": {
                        "name": "Restaurant Tradicional L'Olivera",
                        "amenity": "restaurant",
                        "opening_hours": "Tu-Su 13:00-16:00,20:00-23:30; Mo Off",
                        "website": "https://restaurantolivera.cat",
                        "contact:instagram": "@lolivera_bcn",

                        "addr:housenumber": "180"
                    },
                    "geometry": { "type": "Point", "coordinates": [2.1554, 41.3860] }
                },
                {
                    "type": "Feature",
                    "properties": {
                        "name": "Bar la Tassa de Fusta",
                        "amenity": "bar",
                        "opening_hours": "24/7",
                        "contact:instagram": "barlatassa",
                        "phone": "+34 932 88 99 00",
                        "addr:street": "Carrer d'Aribau",
                        "addr:housenumber": "50"
                    },
                    "geometry": { "type": "Point", "coordinates": [2.1601, 41.3845] }
                },
                {
                    "type": "Feature",
                    "properties": {
                        "name": "Comerç Ecològic La Terra",
                        "shop": "supermarket",
                        "opening_hours": "Mo-Sa 09:00-21:00",
                        "website": "https://laterraeco.cat",
                        "phone": "+34 934 12 34 56",
                        "addr:street": "Gran Via",
                        "addr:housenumber": "580"
                    },
                    "geometry": { "type": "Point", "coordinates": [2.1630, 41.3858] }
                }
            ]
        };

        // Diccionari de Categories amb icones i colors
        const categories = {
            cafeteria: { label: 'Cafeteria', icon: 'fa-coffee', color: 'bg-amber-500', hex: '#f59e0b', tags: ['cafe', 'cafeteria'] },
            clinica: { label: 'Clínica / Salut', icon: 'fa-user-doctor', color: 'bg-emerald-500', hex: '#10b981', tags: ['clinic', 'doctors', 'hospital', 'pharmacy', 'health'] },
            panaderia: { label: 'Forn de Pa', icon: 'fa-bread-slice', color: 'bg-orange-500', hex: '#f97316', tags: ['bakery', 'pastry'] },
            restaurante: { label: 'Restaurant', icon: 'fa-utensils', color: 'bg-rose-500', hex: '#f43f5e', tags: ['restaurant'] },
            bar: { label: 'Bar / Pub', icon: 'fa-beer-mug-empty', color: 'bg-purple-500', hex: '#a855f7', tags: ['bar', 'pub'] },
            comerc: { label: 'Comerç', icon: 'fa-bag-shopping', color: 'bg-blue-500', hex: '#3b82f6', tags: ['shop', 'supermarket', 'convenience', 'clothes'] },
            altres: { label: 'Altres', icon: 'fa-location-dot', color: 'bg-slate-500', hex: '#64748b', tags: [] }
        };

        // Variables Globals
        let map;
        let geojsonLayer;
        let currentFeatures = [];
        let activeCategory = 'all';
        let searchQuery = '';
        let activeMarkerId = null;
        let markerMap = new Map();

        // Carregar aplicació
        window.onload = function() {
            initMap();
            loadGeoJSONData();
            setupEventListeners();
            renderCategoryChips();
        };

        // Inicialitza el Mapa de Leaflet sense cap API Key
        function initMap() {
            map = L.map('map', {
                zoomControl: false
            }).setView([41.3888, 2.1589], 14);

            L.control.zoom({ position: 'topright' }).addTo(map);

            // Capes de Fons Lliures (Free / Open Data)
            const baseMaps = {
                "OpenStreetMap Estàndard": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }),
                "CartoDB Voyager": L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                    maxZoom: 19,
                    attribution: '&copy; CARTO &copy; OpenStreetMap'
                }),
                "CartoDB Positron": L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                    maxZoom: 19,
                    attribution: '&copy; CARTO &copy; OpenStreetMap'
                }),
                "Esri Satèl·lit": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    maxZoom: 18,
                    attribution: 'Tiles &copy; Esri'
                })
            };

            // Per defecte: OpenStreetMap Estàndard
            baseMaps["OpenStreetMap Estàndard"].addTo(map);

            // Selector de capes
            L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

            // Filtra dinàmicament els elements segons el zoom i la vista actual
            map.on('moveend zoomend', updateVisiblePOIs);
        }

        // Intenta carregar data.geojson o bé utilitza les dades de demostració
        async function loadGeoJSONData() {
            const sourceIndicator = document.getElementById('source-indicator');
            let geoData = null;

            try {
                const response = await fetch('./data.geojson');
                if (response.ok) {
                    geoData = await response.json();
                    sourceIndicator.textContent = 'Carregat: data.geojson';
                    sourceIndicator.className = 'text-[10px] uppercase tracking-wider font-semibold px-2 py-0.5 rounded bg-emerald-100 text-emerald-700';
                }
            } catch (err) {
                console.log('Falta data.geojson local, s\'utilitzaran dades de prova integrades.');
            }

            if (!geoData) {
                geoData = fallbackGeoJSON;
                sourceIndicator.textContent = 'Dades de Demostració';
                sourceIndicator.className = 'text-[10px] uppercase tracking-wider font-semibold px-2 py-0.5 rounded bg-indigo-100 text-indigo-700';
            }

            renderGeoJSONOnMap(geoData);
        }

        // Determina la categoria d'un element segons els seus tags OSM
        function getCategory(feature) {
            const props = feature.properties || {};
            const amenity = (props.amenity || '').toLowerCase();
            const shop = (props.shop || '').toLowerCase();
            const healthcare = (props.healthcare || '').toLowerCase();

            for (const [key, cat] of Object.entries(categories)) {
                if (cat.tags.includes(amenity) || cat.tags.includes(shop) || cat.tags.includes(healthcare)) {
                    return key;
                }
            }
            return 'altres';
        }

        // Crea la icona HTML personalitzada del marcador
        function createCustomIcon(categoryKey, isActive = false) {
            const cat = categories[categoryKey] || categories.altres;
            const size = isActive ? 42 : 32;
            
            return L.divIcon({
                className: 'custom-marker-wrapper',
                html: `<div class="custom-marker ${isActive ? 'active' : ''}" style="background-color: ${cat.hex}; width: ${size}px; height: ${size}px;">
                        <i class="fa-solid ${cat.icon} text-xs"></i>
                       </div>`,
                iconSize: [size, size],
                iconAnchor: [size / 2, size / 2]
            });
        }

        // Pinta el GeoJSON al mapa de Leaflet
        function renderGeoJSONOnMap(geoData) {
            if (geojsonLayer) {
                map.removeLayer(geojsonLayer);
            }
            markerMap.clear();

            currentFeatures = (geoData.features || []).map((feature, index) => {
                feature.id = feature.id || `poi-${index}-${Date.now()}`;
                return feature;
            });

            geojsonLayer = L.geoJSON(geoData, {
                pointToLayer: function(feature, latlng) {
                    const catKey = getCategory(feature);
                    const marker = L.marker(latlng, {
                        icon: createCustomIcon(catKey)
                    });

                    // Afegir Popup al marcador
                    const popupContent = buildPopupHTML(feature);
                    marker.bindPopup(popupContent);

                    markerMap.set(feature.id, marker);

                    marker.on('click', () => {
                        highlightPOI(feature.id, true, false);
                    });

                    return marker;
                }
            }).addTo(map);

            // Centrar vista segons el contingut del GeoJSON
            if (currentFeatures.length > 0) {
                const bounds = geojsonLayer.getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [50, 50] });
                }
            }

            updateVisiblePOIs();
        }

        // Traductor d'Opening Hours al Català
        function translateOpeningHours(oh) {
            if (!oh) return null;

            let translated = oh;
            
            if (translated.includes('24/7')) {
                return '24/7 oberts';
            }

            // Traducció de dies
            const dayMap = {
                'Mo': 'Dl', 'Tu': 'Dt', 'We': 'Dc', 'Th': 'Dj',
                'Fr': 'Dv', 'Sa': 'Ds', 'Su': 'Dg'
            };

            Object.keys(dayMap).forEach(day => {
                const regex = new RegExp(`\\b${day}\\b`, 'g');
                translated = translated.replace(regex, dayMap[day]);
            });

            return translated
                .replace(/Off/gi, 'Tancat')
                .replace(/PH/g, 'Festius')
                .replace(/SH/g, 'Vacances escolars');
        }

        // Formata l'adreça des de les propietats OSM
        function formatAddress(props) {
            const street = props['addr:street'] || props['street'] || '';
            const number = props['addr:housenumber'] || props['housenumber'] || '';
            const city = props['addr:city'] || props['city'] || '';

            if (street) {
                return `${street}${number ? ', ' + number : ''}${city ? ' (' + city + ')' : ''}`;
            }
            return props.address || null;
        }

        // HTML del Popup
        function buildPopupHTML(feature) {
            const props = feature.properties || {};
            const catKey = getCategory(feature);
            const cat = categories[catKey] || categories.altres;
            const name = props.name || 'Sense Nom';
            const address = formatAddress(props);
            const openingHours = translateOpeningHours(props.opening_hours);

            return `
                <div class="space-y-1.5">
                    <div class="flex items-center gap-2">
                        <span class="inline-block w-2.5 h-2.5 rounded-full ${cat.color}"></span>
                        <h4 class="font-bold text-slate-800 text-sm">${name}</h4>
                    </div>
                    ${address ? `<p class="text-xs text-slate-500"><i class="fa-solid fa-location-dot mr-1"></i>${address}</p>` : ''}
                    ${openingHours ? `<p class="text-xs text-emerald-700 font-medium"><i class="fa-solid fa-clock mr-1"></i>${openingHours}</p>` : ''}
                </div>
            `;
        }

        // Actualitza els elements del panell lateral segons el zoom i la vista visible
        function updateVisiblePOIs() {
            const bounds = map.getBounds();
            const listContainer = document.getElementById('poi-list');
            listContainer.innerHTML = '';

            let visibleCount = 0;

            currentFeatures.forEach(feature => {
                if (!feature.geometry || !feature.geometry.coordinates) return;

                const coords = feature.geometry.coordinates;
                const latLng = L.latLng(coords[1], coords[0]);
                const isInsideBounds = bounds.contains(latLng);

                const catKey = getCategory(feature);
                const matchesCategory = (activeCategory === 'all' || activeCategory === catKey);

                const name = (feature.properties.name || 'Sense Nom').toLowerCase();
                const address = (formatAddress(feature.properties) || '').toLowerCase();
                const matchesSearch = name.includes(searchQuery) || address.includes(searchQuery) || catKey.includes(searchQuery);

                const marker = markerMap.get(feature.id);

                if (isInsideBounds && matchesCategory && matchesSearch) {
                    visibleCount++;
                    if (marker && !map.hasLayer(marker)) {
                        marker.addTo(map);
                    }
                    const card = createPOICard(feature, catKey);
                    listContainer.appendChild(card);
                } else {
                    if (marker && map.hasLayer(marker)) {
                        map.removeLayer(marker);
                    }
                }
            });

            document.getElementById('counter-badge').textContent = `${visibleCount} elements a la vista`;

            if (visibleCount === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i class="fa-solid fa-map-pin text-3xl mb-2 text-slate-300"></i>
                        <p class="text-sm font-semibold">Cap element trobat en aquesta àrea.</p>
                        <p class="text-xs">Mou el mapa o modifica els filtres de cerca.</p>
                    </div>
                `;
            }
        }

        // Genera la targeta lateral
        function createPOICard(feature, catKey) {
            const props = feature.properties || {};
            const cat = categories[catKey] || categories.altres;
            
            const name = props.name || 'Sense Nom';
            const address = formatAddress(props);
            const openingHours = translateOpeningHours(props.opening_hours);
            const phone = props.phone || props['contact:phone'];
            const website = props.website || props['contact:website'];
            
            // Format d'Instagram
            let instagram = props.instagram || props['contact:instagram'];
            let instagramUrl = null;
            if (instagram) {
                if (instagram.startsWith('http')) {
                    instagramUrl = instagram;
                    instagram = '@' + instagram.split('/').filter(Boolean).pop();
                } else {
                    const cleanHandle = instagram.replace('@', '');
                    instagramUrl = `https://instagram.com/${cleanHandle}`;
                    instagram = `@${cleanHandle}`;
                }
            }

            const isSelected = feature.id === activeMarkerId;

            const card = document.createElement('div');
            card.id = `card-${feature.id}`;
            card.className = `p-4 rounded-xl border transition-all duration-200 cursor-pointer bg-white ${
                isSelected ? 'ring-2 ring-indigo-500 border-indigo-500 shadow-md' : 'border-slate-200 hover:border-indigo-300 hover:shadow-sm'
            }`;

            // Clic a la targeta -> Centra al mapa, obre el popup i fa zoom
            card.onclick = () => {
                highlightPOI(feature.id, false, true);
            };

            card.innerHTML = `
                <div class="flex items-start justify-between gap-2 mb-2">
                    <h3 class="text-base font-bold text-slate-900 leading-snug">${name}</h3>
                    <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-semibold text-white shrink-0 ${cat.color}">
                        <i class="fa-solid ${cat.icon}"></i>
                        ${cat.label}
                    </span>
                </div>

                <div class="space-y-1.5 text-xs text-slate-600">
                    ${address ? `
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-location-dot w-4 text-center text-slate-400"></i>
                            <span class="truncate">${address}</span>
                        </div>
                    ` : ''}

                    ${openingHours ? `
                        <div class="flex items-start gap-2 text-emerald-700 font-medium bg-emerald-50/70 p-2 rounded-lg border border-emerald-100/80">
                            <i class="fa-solid fa-clock w-4 text-center text-emerald-600 mt-0.5"></i>
                            <span>${openingHours}</span>
                        </div>
                    ` : ''}

                    ${phone ? `
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-phone w-4 text-center text-slate-400"></i>
                            <a href="tel:${phone}" class="hover:underline text-indigo-600 font-medium" onclick="event.stopPropagation()">${phone}</a>
                        </div>
                    ` : ''}

                    ${website ? `
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-globe w-4 text-center text-slate-400"></i>
                            <a href="${website}" target="_blank" rel="noopener noreferrer" class="hover:underline text-indigo-600 truncate font-medium" onclick="event.stopPropagation()">${website.replace(/^https?:\/\//, '')}</a>
                        </div>
                    ` : ''}

                    ${instagramUrl ? `
                        <div class="flex items-center gap-2">
                            <i class="fa-brands fa-instagram w-4 text-center text-pink-500 text-sm"></i>
                            <a href="${instagramUrl}" target="_blank" rel="noopener noreferrer" class="hover:underline text-pink-600 font-medium" onclick="event.stopPropagation()">${instagram}</a>
                        </div>
                    ` : ''}
                </div>
            `;

            return card;
        }

        // Destacar un POI (al mapa i a la llista)
        function highlightPOI(featureId, scrollSidebar = true, openPopup = true) {
            if (activeMarkerId && markerMap.has(activeMarkerId)) {
                const prevFeature = currentFeatures.find(f => f.id === activeMarkerId);
                if (prevFeature) {
                    const prevCat = getCategory(prevFeature);
                    markerMap.get(activeMarkerId).setIcon(createCustomIcon(prevCat, false));
                }
            }

            activeMarkerId = featureId;
            const feature = currentFeatures.find(f => f.id === featureId);

            if (feature && markerMap.has(featureId)) {
                const catKey = getCategory(feature);
                const marker = markerMap.get(featureId);
                marker.setIcon(createCustomIcon(catKey, true));

                if (openPopup) {
                    const coords = feature.geometry.coordinates;
                    map.flyTo([coords[1], coords[0]], Math.max(map.getZoom(), 16), {
                        duration: 0.8
                    });
                    setTimeout(() => {
                        marker.openPopup();
                    }, 800);
                }
            }

            // Actualitzar estat visual de les targetes a la llista
            document.querySelectorAll('#poi-list > div').forEach(card => {
                card.classList.remove('ring-2', 'ring-indigo-500', 'border-indigo-500', 'shadow-md');
                card.classList.add('border-slate-200');
            });

            const activeCard = document.getElementById(`card-${featureId}`);
            if (activeCard) {
                activeCard.classList.remove('border-slate-200');
                activeCard.classList.add('ring-2', 'ring-indigo-500', 'border-indigo-500', 'shadow-md');

                if (scrollSidebar) {
                    activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        // Renderitzar botons de filtrat per categoria
        function renderCategoryChips() {
            const container = document.getElementById('category-chips');
            container.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = `px-3 py-1 rounded-full text-xs font-medium border transition-colors whitespace-nowrap ${
                activeCategory === 'all' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'
            }`;
            allBtn.textContent = 'Tots';
            allBtn.onclick = () => {
                activeCategory = 'all';
                renderCategoryChips();
                updateVisiblePOIs();
            };
            container.appendChild(allBtn);

            Object.entries(categories).forEach(([key, cat]) => {
                const btn = document.createElement('button');
                const isActive = activeCategory === key;
                btn.className = `px-3 py-1 rounded-full text-xs font-medium border transition-colors whitespace-nowrap flex items-center gap-1.5 ${
                    isActive ? `${cat.color} text-white border-transparent` : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'
                }`;
                btn.innerHTML = `<i class="fa-solid ${cat.icon}"></i> ${cat.label}`;
                btn.onclick = () => {
                    activeCategory = key;
                    renderCategoryChips();
                    updateVisiblePOIs();
                };
                container.appendChild(btn);
            });
        }

        // Cercador en temps real
        function setupEventListeners() {
            document.getElementById('search-input').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase().trim();
                updateVisiblePOIs();
            });
        }
    </script>
</body>
</html>
